name: Deploy to Yandex Object Storage

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.22.1"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin

      - name: Build site
        run: zola build

      - name: Configure AWS CLI for Yandex Object Storage
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.YC_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          aws-region:            ru-central1

      - name: Sync to Yandex Object Storage
        run: |
          aws s3 sync public/ s3://${{ secrets.YC_BUCKET_NAME }}/ \
            --endpoint-url https://storage.yandexcloud.net \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Set Cache-Control for HTML files
        run: |
          aws s3 cp s3://${{ secrets.YC_BUCKET_NAME }}/ s3://${{ secrets.YC_BUCKET_NAME }}/ \
            --endpoint-url https://storage.yandexcloud.net \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=300, must-revalidate" \
            --content-type "text/html; charset=utf-8"
